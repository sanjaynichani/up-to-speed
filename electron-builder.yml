appId: com.uptospeed.app
productName: Up to Speed
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!README.md'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  notarize: false
  extendInfo:
    NSScreenCaptureUsageDescription: Up to Speed blurs your desktop behind the capture overlay.
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
